name: CortexCLI Scan

permissions: {}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    
jobs:
  cortexcli:
    runs-on: ubuntu-latest
    environment: Cortex
    env:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_BASE_URL: ${{ secrets.CORTEX_API_BASE_URL || secrets.CORTEX_API_URL }}
      IMAGE_NAME: "${{ vars.IMAGE_NAME }}:latest"
      OUTPUT_FILE: "results.json"

    steps:
    # Initial Setup
    - name: Checkout
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5

    - name: Download cortexcli
      run: |
        crtx_resp=$(curl -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" -H "Authorization: ${CORTEX_API_KEY}" "${CORTEX_API_BASE_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
        crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
        curl -o cortexcli $crtx_url
        chmod +x cortexcli
        ./cortexcli --version
  
    # Do CWP image scanning
    - name: CWP Image Scan Dependency
      run: sudo apt install libhyperscan5 jq -y
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

    - name: Build Image and export image ID
      run: |
        docker build -t $IMAGE_NAME .

    - name: Cortex CLI Image Scan
      run: |
        results=$(./cortexcli \
          image scan \
          --timeout 600 \
          --name $IMAGE_NAME \
          --output-format json \
          $IMAGE_NAME)

        echo "$results" | sed -n 's/.*<SCAN_INTRO_START>\(.*\)<SCAN_INTRO_END>.*/\1/p' | jq . > scanIntro.json
        echo "$results" | sed 's/<SCAN_INTRO_START>.*<SCAN_INTRO_END>//g' | sed '/^[[:space:]]*$/d' | jq . > $OUTPUT_FILE

    - name: Uploade results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: success() || failure()
      with:
        name: cwp-results
        path: *.json
      
