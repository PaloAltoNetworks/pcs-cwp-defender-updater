name: Cortex Code Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  cortex-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    runs-on: ubuntu-latest
    steps:
        # Perform Code Check out
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # Scan Code
      - name: Run Cortex Code Security Scan
        uses: jfmontufar/cortex-cloud-scan@1d48be58b3815a8e093b126d1b5f558d0f955944
        with:
          scan-type: code
          api-base-url: ${{ secrets.CORTEX_API_BASE_URL }}
          api-key: ${{ secrets.CORTEX_API_KEY }}
          api-key-id: ${{ secrets.CORTEX_API_KEY_ID }}
          directory: .
          repo-id: ${{ github.repository }}
          severity: high,critical
          branch: ${{ github.ref_name }}
          upload-mode: no-upload
          output-format: sarif
          output-file-path: cortex-results.sarif

        # Format SARIF to be ready for GHAS
      - name: Format SARIF
        id: format_sarif
        if: success() || failure()
        run: |
          jq -e . cortex-results.sarif > /dev/null # fails the step if the scan didn't produce valid SARIF
          jq '(.runs[].tool.driver.rules[]? | select(.helpUri != null)) |= (.help.markdown = (.help.text + "\n\n**More Info:** [Rule Reference](" + .helpUri + ")"))' cortex-results.sarif > tmp-results.sarif
          jq '(.runs[].results[]?.suppressions[]?.kind) = "external"' tmp-results.sarif > cortex-results.sarif
          jq '(.runs[].results[]?.locations[]?.physicalLocation.region? // empty) |= with_entries(if (.key | test("^(start|end)(Line|Column)$")) and (.value < 1) then .value = 1 else . end)' cortex-results.sarif > tmp-results.sarif 
          mv tmp-results.sarif cortex-results.sarif 


        # Upload results to GHAS
      - name: Upload SARIF results
        if: always() && steps.format_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: cortex-results.sarif
